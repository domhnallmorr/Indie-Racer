; Forgiving keyboard defaults. Set assistance_strength=0 for the unassisted model.
[meta]
schema_version=1
[assists]
assistance_strength=1.0
steering_response_s=0.3
corner_grip_fraction=0.85
; Extra steering travel for tyre slip/understeer; yaw protection remains unchanged.
steering_range_multiplier=1.25
yaw_stability_rate_s=14.0
sideslip_damping_rate_s=10.0
traction_slip_limit=0.06
braking_slip_limit=0.12
