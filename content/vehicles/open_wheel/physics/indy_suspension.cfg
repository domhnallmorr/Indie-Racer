; Sprung-body roll/pitch and wheel-travel prototype for the human at Indianapolis.
; Original file is a source reference. No executable or setup file is modified.
[icr2]
source="RACE_IND.STG"
sha256="bc556d3386facaf6abb5419987fe7523d5f3170a7165c1602b1fec8f27da2445"
; Confirmed 32-bit fields at 0x40/44/48/4C: RF/RR/LR/LF.
fl_shock=85
fr_shock=70
rl_shock=75
rr_shock=65
[prototype]
; Authored SI values at reference ICR2 shock setting 50; not recovered rates.
; Actual stiffness is scaled by the mean recovered dimensionless coefficient.
; Latest Indy telemetry reached ~10 degrees. Scale K and I together by four
; to quarter body lean while preserving reaction moments and response timing.
roll_stiffness_nm_rad=180000.0
pitch_stiffness_nm_rad=180000.0
; Effective reduced-mode inertia, not a measured bare-chassis inertia.
roll_inertia_kgm2=1000.0
pitch_inertia_kgm2=1000.0
damping_ratio=0.8
[travel]
; Loaded reference support height; authored prototype SI values.
ride_height_m=0.16
; Travel mode only: tighter heave/pitch; modal comparison retains stage-2 rates.
heave_stiffness_n_m=1200000.0
pitch_stiffness_scale=6.0
; Double roll K and I together: half deflection, accepted transfer timing.
roll_stiffness_scale=2.0
bump_travel_m=0.06
rebound_travel_m=0.05
bump_stop_stiffness_n_m=3000000.0
